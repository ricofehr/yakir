---

- name: Create monitoring namespace
  kubernetes.core.k8s:
    name: "{{ monitoring_namespace }}"
    api_version: v1
    kind: Namespace
    state: present

- name: Add prometheus chart repo
  kubernetes.core.helm_repository:
    name: prometheus
    repo_url: "{{ monitoring_prometheus_repo }}"

# Before the release that opens the write receivers, so a failed play never
# leaves them reachable from outside the cluster.
- name: Refuse the prometheus write endpoints on the public exporter host
  kubernetes.core.k8s:
    state: present
    template: prometheus-write-deny.yml.j2
  when: monitoring_tracing_enabled | bool

- name: Look up the existing NextSRE webhook token
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ monitoring_nextsre_token_secret }}"
    namespace: "{{ monitoring_namespace }}"
  register: monitoring_nextsre_token_lookup
  no_log: true

- name: Provision NextSRE webhook token when not present
  when: (monitoring_nextsre_token_lookup.resources | length) == 0
  no_log: true
  block:
    - name: Generate random webhook token for NextSRE
      ansible.builtin.set_fact:
        monitoring_nextsre_token: "{{ lookup('community.general.random_string', length=32, special=false) }}"

    - name: Store NextSRE webhook token secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ monitoring_nextsre_token_secret }}"
            namespace: "{{ monitoring_namespace }}"
            annotations:
              reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
              reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "{{ monitoring_nextsre_namespace }}"
              reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
              reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "{{ monitoring_nextsre_namespace }}"
          type: Opaque
          stringData:
            token: "{{ monitoring_nextsre_token }}"

- name: Ensure NextSRE webhook token secret carries Reflector annotations
  kubernetes.core.k8s:
    state: patched
    kind: Secret
    name: "{{ monitoring_nextsre_token_secret }}"
    namespace: "{{ monitoring_namespace }}"
    definition:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "{{ monitoring_nextsre_namespace }}"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "{{ monitoring_nextsre_namespace }}"
  when: (monitoring_nextsre_token_lookup.resources | length) > 0
  no_log: true

- name: Deploy Prometheus
  kubernetes.core.helm:
    name: prometheus
    chart_ref: prometheus/prometheus
    chart_version: "{{ monitoring_prometheus_version }}"
    release_namespace: "{{ monitoring_namespace }}"
    values:
      alertmanager:
        persistence:
          storageClass: "{{ monitoring_storage_class }}"
        extraSecretMounts:
          - name: nextsre-token
            mountPath: /etc/alertmanager/secrets/nextsre
            subPath: ""
            secretName: "{{ monitoring_nextsre_token_secret }}"
            readOnly: true
        config:
          global: {}
          templates:
            - '/etc/alertmanager/*.tmpl'
          receivers:
            - name: default-receiver
            - name: nextsre
              webhook_configs:
                - url: "{{ monitoring_nextsre_webhook_url }}"
                  send_resolved: false
                  http_config:
                    authorization:
                      type: Bearer
                      credentials_file: /etc/alertmanager/secrets/nextsre/token
          route:
            group_wait: 10s
            group_interval: 5m
            repeat_interval: 3h
            receiver: default-receiver
            routes:
              - receiver: nextsre
                matchers:
                  - severity =~ "warning|critical|fatal"
                continue: true
      serverFiles:
        alerting_rules.yml:
          groups:
            - name: kubernetes-workloads
              rules:
                - alert: KubePodCrashLooping
                  expr: >-
                    increase(kube_pod_container_status_restarts_total[5m]) > 0 and on(namespace, pod, container)
                    kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
                  for: 2m
                  labels:
                    severity: warning
                  annotations:
                    summary: "{% raw %}Pod {{ $labels.pod }} is crash-looping in namespace {{ $labels.namespace }}{% endraw %}"
                    description: >-
                      {% raw %}Container {{ $labels.container }} in pod {{ $labels.pod }}
                      (namespace {{ $labels.namespace }}) has restarted multiple times and is in CrashLoopBackOff.{% endraw %}
                - alert: KubePodNotReady
                  expr: >-
                    sum by (namespace, pod) (max by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown"}) *
                    on(namespace, pod) group_left(owner_kind) topk by(namespace, pod) (1,
                    max by(namespace, pod, owner_kind) (kube_pod_owner{owner_kind!="Job"}))) > 0 or on(namespace, pod)
                    (kube_pod_status_ready{condition="false"} == 1 and on(namespace, pod) kube_pod_status_phase{phase="Running"} == 1)
                  for: 10m
                  labels:
                    severity: warning
                  annotations:
                    summary: "{% raw %}Pod {{ $labels.pod }} is not ready in namespace {{ $labels.namespace }}{% endraw %}"
                    description: >-
                      {% raw %}Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been in non-ready
                      phase for more than 10 minutes.{% endraw %}
                - alert: KubeDeploymentReplicasMismatch
                  expr: >-
                    kube_deployment_spec_replicas != kube_deployment_status_replicas_available
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "{% raw %}Deployment {{ $labels.deployment }} replica mismatch in namespace {{ $labels.namespace }}{% endraw %}"
                    description: >-
                      {% raw %}Deployment {{ $labels.deployment }} in namespace {{ $labels.namespace }} has
                      unavailable or mismatched replicas compared to desired spec.{% endraw %}
      server:
        extraFlags: "{{ monitoring_prometheus_flags + (monitoring_prometheus_tracing_flags if monitoring_tracing_enabled | bool else []) }}"
        otlp: "{{ monitoring_prometheus_otlp if monitoring_tracing_enabled | bool else {} }}"
        tsdb: "{{ monitoring_prometheus_tsdb if monitoring_tracing_enabled | bool else {} }}"
        exemplars: "{{ monitoring_prometheus_exemplars if monitoring_tracing_enabled | bool else {} }}"
        ingress:
          ingressClassName: ingress-traefik
          enabled: true
          hosts: ["{{ monitoring_exporter_domain }}"]
          annotations:
            kubernetes.io/ingress.class: ingress-traefik
            kubernetes.io/tls-acme: "true"
            cert-manager.io/issuer: "{{ monitoring_cert_issuer }}"
            cert-manager.io/issuer-kind: ClusterIssuer
          tls:
            - secretName: prometheus-cert
              hosts:
                - "{{ monitoring_exporter_domain }}"
        persistentVolume:
          storageClass: "{{ monitoring_storage_class }}"
          size: "{{ monitoring_prometheus_storage_size }}"

- name: Add grafana chart repo
  kubernetes.core.helm_repository:
    name: grafana
    repo_url: "{{ monitoring_grafana_repo }}"

- name: Deploy CM grafana for k8s dashboard
  kubernetes.core.k8s:
    state: present
    template: grafana-k8s-dashboard.yml.j2

- name: Deploy CM prometheus datasource for grafana
  kubernetes.core.k8s:
    state: present
    template: prometheus-datasource.yml.j2

- name: Deploy Grafana
  kubernetes.core.helm:
    name: grafana
    chart_ref: grafana/grafana
    chart_version: "{{ monitoring_grafana_version }}"
    release_namespace: "{{ monitoring_namespace }}"
    values:
      # One pod: the dashboards volume is ReadWriteOnce, so a second replica
      # waits on the attach for ever, and a rolling update would too.
      replicas: 1
      deploymentStrategy:
        type: Recreate
      grafana.ini: "{{ monitoring_grafana_tracing_ini if monitoring_tracing_enabled | bool else {} }}"
      ingress:
        ingressClassName: ingress-traefik
        enabled: true
        hosts: ["{{ monitoring_grafana_domain }}"]
        annotations:
          kubernetes.io/ingress.class: ingress-traefik
          kubernetes.io/tls-acme: "true"
          cert-manager.io/issuer: "{{ monitoring_cert_issuer }}"
          cert-manager.io/issuer-kind: ClusterIssuer
        tls:
          - secretName: grafana-cert
            hosts:
              - "{{ monitoring_grafana_domain }}"
      persistence:
        enabled: "{{ monitoring_persistence_disk }}"

      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
        datasources:
          enabled: true
          label: "{{ monitoring_grafana_datasource_label }}"

      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: 'default'
              orgId: 1
              folder: ''
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default
...
