---

- name: Create monitoring namespace
  kubernetes.core.k8s:
    name: "{{ monitoring_namespace }}"
    api_version: v1
    kind: Namespace
    state: present

- name: Add prometheus chart repo
  kubernetes.core.helm_repository:
    name: prometheus
    repo_url: "{{ monitoring_prometheus_repo }}"

- name: Deploy Prometheus
  kubernetes.core.helm:
    name: prometheus
    chart_ref: prometheus/prometheus
    chart_version: "{{ monitoring_prometheus_version }}"
    release_namespace: "{{ monitoring_namespace }}"
    values:
      alertmanager:
        persistence:
          storageClass: "{{ monitoring_storage_class }}"
      server:
        ingress:
          ingressClassName: ingress-traefik
          enabled: true
          hosts: ["{{ monitoring_exporter_domain }}"]
          annotations:
            kubernetes.io/ingress.class: ingress-traefik
            kubernetes.io/tls-acme: "true"
            cert-manager.io/issuer: "{{ monitoring_cert_issuer }}"
            cert-manager.io/issuer-kind: ClusterIssuer
          tls:
            - secretName: prometheus-cert
              hosts:
                - "{{ monitoring_exporter_domain }}"
        persistentVolume:
          storageClass: "{{ monitoring_storage_class }}"

- name: Add grafana chart repo
  kubernetes.core.helm_repository:
    name: grafana
    repo_url: "{{ monitoring_grafana_repo }}"

- name: Deploy CM grafana for k8s dashboard
  kubernetes.core.k8s:
    state: present
    template: grafana-k8s-dashboard.yml.j2

- name: Deploy CM prometheus datasource for grafana
  kubernetes.core.k8s:
    state: present
    template: prometheus-datasource.yml.j2

- name: Deploy Grafana
  kubernetes.core.helm:
    name: grafana
    chart_ref: grafana/grafana
    chart_version: "{{ monitoring_grafana_version }}"
    release_namespace: "{{ monitoring_namespace }}"
    values:
      replicas: 2
      ingress:
        ingressClassName: ingress-traefik
        enabled: true
        hosts: ["{{ monitoring_grafana_domain }}"]
        annotations:
          kubernetes.io/ingress.class: ingress-traefik
          kubernetes.io/tls-acme: "true"
          cert-manager.io/issuer: "{{ monitoring_cert_issuer }}"
          cert-manager.io/issuer-kind: ClusterIssuer
        tls:
          - secretName: grafana-cert
            hosts:
              - "{{ monitoring_grafana_domain }}"
      persistence:
        enabled: "{{ monitoring_persistence_disk }}"

      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
        datasources:
          enabled: true
          label: "{{ monitoring_grafana_datasource_label }}"

      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: 'default'
              orgId: 1
              folder: ''
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default
...
