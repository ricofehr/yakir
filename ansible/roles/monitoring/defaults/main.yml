---

monitoring_namespace: "monitoring"

monitoring_persistence_disk: false
monitoring_storage_class: "rook-ceph-block"
monitoring_grafana_domain: "monitoring.k8s.local"
monitoring_exporter_domain: "exporter.k8s.local"
monitoring_cert_issuer: "selfsigned-ca"

monitoring_grafana_datasource_label: "grafana_datasource"

monitoring_prometheus_version: "23.4.0"
monitoring_grafana_version: "6.58.8"

# Off by default: prometheus accepts pushed metrics and stores exemplars, grafana
# links them to tempo and traces itself, only where the tracing role runs.
monitoring_tracing_enabled: false
monitoring_otlp_grpc_endpoint: ""

...
