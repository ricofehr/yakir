---

- name: Add flannel chart repo
  kubernetes.core.helm_repository:
    name: flannel-cni
    repo_url: "{{ cni_flannel_helm_repo }}"

- name: Create flannel namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        labels:
          kubernetes.io/metadata.name: "{{ cni_flannel_namespace }}"
          name: "{{ cni_flannel_namespace }}"
          pod-security.kubernetes.io/enforce: privileged
        name: "{{ cni_flannel_namespace }}"

- name: Deploy Flannel
  kubernetes.core.helm:
    name: flannel
    chart_ref: "flannel-cni/flannel"
    chart_version: "{{ cni_flannel_version }}"
    release_namespace: "{{ cni_flannel_namespace }}"

# Terminal pods are excluded, not matched by --all: an Evicted corpse never goes
# Ready and holds the wait for its full timeout. Pending must stay in the set -
# kubectl resolves the match once, so a Running-only filter would pass early.
- name: Wait for flannel pods become ready
  ansible.builtin.command: >-
    kubectl wait pod --namespace={{ cni_flannel_namespace }}
    --field-selector=status.phase!=Failed,status.phase!=Succeeded
    --for=condition=Ready --timeout=600s
  changed_when: false

...
