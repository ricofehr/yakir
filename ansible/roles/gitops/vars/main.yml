---

gitops_argocd_repo: "https://argoproj.github.io/argo-helm"
gitops_cnpg_repo: "https://cloudnative-pg.github.io/charts"

gitops_argocd_params:
  # Traefik terminates TLS at the ingress, so the server speaks plain http behind it.
  server.insecure: true
gitops_argocd_tracing_params:
  otlp.address: "{{ gitops_otlp_grpc_endpoint }}"
  otlp.insecure: true

gitops_repo_secret: "ai-factory-repo"
gitops_masterkey_secret: "litellm-masterkey"
gitops_llama_secret: "llama-credentials"
gitops_keycloak_secret: "keycloak-admin"
gitops_github_token_secret: "github-token"
gitops_neo4j_secret: "neo4j-auth"
# Names and keys are fixed by charts/valkey and charts/gitlab in the ai-factory
# repository, which reference them; they are the contract between the two.
gitops_valkey_secret: "valkey-auth"
gitops_gitlab_backup_secret: "gitlab-backup-offsite"

# MinIO's client, to set up GitLab's off-site store. MinIO's community releases
# are archived and dl.min.io no longer serves them; this is the last release
# published on GitHub, pinned by checksum.
gitops_mc_version: "RELEASE.2025-08-13T08-35-41Z"
gitops_mc_url: "https://github.com/minio/mc/releases/download/{{ gitops_mc_version }}/mc.linux-amd64.{{ gitops_mc_version }}"
gitops_mc_sha256: "01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891"

gitops_root_application: "ai-factory"
gitops_project: "ai-factory"

# Cluster-scoped kinds the factory legitimately creates. Anything outside this
# list is refused by Argo CD rather than applied with cluster-admin. Namespaces
# are listed by name in templates/app-project.yml.j2, not here.
#
# The last two are GitLab's admission policy: RBAC cannot narrow Secret
# creation by name, so a ValidatingAdmissionPolicy holds the service accounts
# that create Secrets to their own.
gitops_project_cluster_resources:
  - {group: "apiextensions.k8s.io", kind: CustomResourceDefinition}
  - {group: "rbac.authorization.k8s.io", kind: ClusterRole}
  - {group: "rbac.authorization.k8s.io", kind: ClusterRoleBinding}
  - {group: "admissionregistration.k8s.io", kind: ValidatingWebhookConfiguration}
  - {group: "admissionregistration.k8s.io", kind: MutatingWebhookConfiguration}
  - {group: "admissionregistration.k8s.io", kind: ValidatingAdmissionPolicy}
  - {group: "admissionregistration.k8s.io", kind: ValidatingAdmissionPolicyBinding}

# Namespaced kinds the factory must never create, on top of the ResourceQuota
# and LimitRange the template always denies. A destination grants every kind
# that is not denied here, so this is what stops a commit under apps/ from
# planting a credential or a node-wide workload.
#
# The ai-factory repository renders neither kind anywhere: its application
# passwords come from CloudNativePG's generated secrets and the externally
# supplied ones are created by this role. Denying them costs nothing today and
# mechanically enforces that repository's "never commit a credential" rule.
gitops_project_namespaced_denied:
  - {group: "", kind: Secret}
  - {group: "apps", kind: DaemonSet}
  # kube-gitops is a destination: without this, a commit could rewrite this very
  # project (or factory-apps) and widen its own envelope.
  - {group: "argoproj.io", kind: AppProject}

...
