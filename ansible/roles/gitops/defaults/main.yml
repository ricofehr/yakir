---

gitops_namespace: "gitops"
gitops_cnpg_namespace: "cnpg-system"

gitops_argocd_version: "10.9.2"
gitops_cnpg_version: "0.29.0"

gitops_domain: "k8s.local"
gitops_argocd_domain: "gitops.{{ gitops_domain }}"
gitops_cert_issuer: "my-ca-issuer"

# Off by default: Argo CD sends the spans of its reconciles to the
# OpenTelemetry collector, only where the tracing role runs.
gitops_tracing_enabled: false
gitops_otlp_grpc_endpoint: ""

# Git repository holding the ai-factory Argo CD applications. The playbook skips
# this role entirely while the url is empty, so a plain cluster install is unchanged.
gitops_repo_url: ""
gitops_repo_branch: "main"
gitops_apps_path: "apps"
# Path, on the ansible controller, to the private deploy key for the repository
# above. Leave empty for a public repository fetched over https.
gitops_repo_ssh_key: ""

# The bootstrap owns every ai-factory namespace. Some receive credentials the
# Argo CD applications cannot generate for themselves; the rest exist because
# the wave 0 database application writes into namespaces whose own application
# does not sync until wave 3, and CreateNamespace only ever creates an
# application's own destination namespace.
gitops_app_namespaces:
  - "ai-data"
  - "ai-llm"
  - "ai-mcp"
  - "ai-runners"
  - "ai-identity"
  - "ai-knowledge"
  - "ai-assistant"
  - "ai-gitlab"
# Namespaces the root project may deploy into: the factory's own, plus the ones
# hosting operators rather than workloads.
#
# Weigh any addition: anything committed under apps/ is applied with the
# application controller's rights, so a destination here is a namespace the
# ai-factory repository can write every non-blacklisted kind into.
gitops_project_namespaces: >-
  {{ gitops_app_namespaces + [gitops_namespace, 'toolhive-system', gitops_build_namespace] }}
# The factory's shared BuildKit. Rootless BuildKit needs seccomp Unconfined, which
# Pod Security baseline refuses, so this namespace is created at privileged.
# The weight of the destination note above applies doubly: the ai-factory
# repository can run privileged pods here.
gitops_build_namespace: "ai-build"

# The factory's own apps, generated by ai-factory's delivery ApplicationSets from
# the deployments repository on its in-cluster GitLab. Their project is kept
# apart from the platform's: one source, the prod-* and review-* namespaces, no
# cluster-scoped kind but the namespace a review deployment owns.
gitops_apps_project: "factory-apps"
gitops_apps_repo_url: "http://gitlab-webservice-default.{{ gitops_gitlab_namespace }}.svc.cluster.local:8181/factory/deployments.git"
# Prefixes with a trailing "*" only: the admission policies turn each into a
# startsWith check.
gitops_apps_namespaces:
  - "prod-*"
  - "review-*"
# The namespaced kinds the factory-apps project may apply (templates/apps-project.yml.j2).
gitops_apps_namespaced_allowed:
  - {group: "", kind: ConfigMap}
  - {group: "", kind: Service}
  - {group: "", kind: ServiceAccount}
  - {group: "", kind: PersistentVolumeClaim}
  - {group: "", kind: ResourceQuota}
  - {group: "", kind: LimitRange}
  - {group: "apps", kind: Deployment}
  - {group: "apps", kind: StatefulSet}
  - {group: "batch", kind: Job}
  - {group: "batch", kind: CronJob}
  - {group: "autoscaling", kind: HorizontalPodAutoscaler}
  - {group: "networking.k8s.io", kind: Ingress}
  - {group: "networking.k8s.io", kind: NetworkPolicy}
  - {group: "cert-manager.io", kind: Certificate}
  - {group: "postgresql.cnpg.io", kind: Cluster}
# The ClusterIssuers app Certificates may name: the public ACME ones, never the
# internal CA, which signs anything it is asked.
gitops_apps_cert_issuers:
  - "letsencrypt-prod"
  - "letsencrypt-staging"
# Label on every app namespace (ai-factory sets it, the namespaces policy
# requires it), selecting them for the quota-required policy.
gitops_apps_namespace_label: "factory.nextdeploy.io/app-namespace"
# Label on the app chart's ResourceQuota, the parameter of that policy.
gitops_apps_quota_label: "factory.nextdeploy.io/app-quota"
# The most an app namespace's ResourceQuota may grant (templates/apps-resources-policy.yml.j2).
gitops_apps_quota_max:
  requests.cpu: "4"
  requests.memory: "8Gi"
  limits.memory: "16Gi"
  requests.storage: "100Gi"
  persistentvolumeclaims: "10"
  pods: "30"
gitops_llm_namespace: "ai-llm"
gitops_mcp_namespace: "ai-mcp"
gitops_knowledge_namespace: "ai-knowledge"
gitops_gitlab_namespace: "ai-gitlab"
gitops_identity_namespace: "ai-identity"
gitops_assistant_namespace: "ai-assistant"
gitops_keycloak_admin_user: "admin"
gitops_neo4j_user: "neo4j"

# Api key of the llama-server exposed by ricostation. Empty means the model
# server is still unauthenticated and the gateway sends a placeholder it ignores.
gitops_llama_api_key: ""

# Personal access token read by the GitHub MCP server and the context graph
# ingester. Empty means both reach public repositories only.
gitops_github_token: ""

# Path, on the ansible controller, to a file holding the passphrase GitLab's
# off-site copies of its rails secret are encrypted with. A path, so nothing
# secret passes through a command line or an extra var. Keep the file outside
# the cluster too: a rebuild loses the Secret, and without the passphrase the
# off-site copies cannot be decrypted. Empty means the off-site credentials are
# not written and GitLab's backup mirror waits for them.
gitops_gitlab_backup_passphrase_file: ""

# Path, on the ansible controller, to a yaml file holding MinIO admin
# credentials (accessKey, secretKey), used only to set up GitLab's off-site
# store below. Separate from --backup-*, whose keys Velero also writes into the
# cluster: a key that can delete must not live where the backups are meant to
# survive a compromise. Give Velero bucket-scoped keys.
gitops_minio_admin_credentials_file: ""

# The off-site store GitLab's backup mirror copies to, on the MinIO behind
# backup_s3_url (the one Velero uses).
gitops_gitlab_backup_bucket: "gitlab-backups"
gitops_gitlab_backup_user: "gitlab-backup"
gitops_gitlab_backup_retention_days: 90
gitops_gitlab_backup_noncurrent_days: 30

...
