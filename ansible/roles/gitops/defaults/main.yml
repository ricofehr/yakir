---

gitops_namespace: "gitops"
gitops_cnpg_namespace: "cnpg-system"

gitops_argocd_version: "10.9.2"
gitops_cnpg_version: "0.29.0"

gitops_domain: "k8s.local"
gitops_argocd_domain: "gitops.{{ gitops_domain }}"
gitops_cert_issuer: "my-ca-issuer"

# Git repository holding the ai-factory Argo CD applications. The playbook skips
# this role entirely while the url is empty, so a plain cluster install is unchanged.
gitops_repo_url: ""
gitops_repo_branch: "main"
gitops_apps_path: "apps"
# Path, on the ansible controller, to the private deploy key for the repository
# above. Leave empty for a public repository fetched over https.
gitops_repo_ssh_key: ""

# The bootstrap owns every ai-factory namespace. Some receive credentials the
# Argo CD applications cannot generate for themselves; the rest exist because
# the wave 0 database application writes into namespaces whose own application
# does not sync until wave 3, and CreateNamespace only ever creates an
# application's own destination namespace.
gitops_app_namespaces:
  - "ai-data"
  - "ai-llm"
  - "ai-mcp"
  - "ai-runners"
  - "ai-identity"
  - "ai-knowledge"
  - "ai-devpods"
  - "ai-assistant"
# Where cert-manager runs, and therefore where the factory's DNS-01 webhook
# solver has to run too. Tracks the cert_manager role rather than restating
# "kube-cert": both roles run in the leader play, so moving cert-manager without
# moving the solver would otherwise break DNS-01 silently.
gitops_cert_namespace: "{{ cert_manager_namespace | default('kube-cert') }}"
# Namespaces the root project may deploy into: the factory's own, plus the ones
# hosting operators rather than workloads.
#
# The last two are not workload destinations, and the factory's DNS-01 webhook
# solver needs both. It is an aggregated extension api server, so it needs a
# RoleBinding on extension-apiserver-authentication-reader in kube-system to
# validate the client certificates the apiserver presents; and it has to be
# deployed into cert-manager's own namespace, because a ClusterIssuer resolves
# its solver's credential refs in --cluster-resource-namespace. Without either
# one Argo CD refuses the whole application and the issuer never appears.
#
# Widening the project is the cost of this feature. Weigh it when adding to the
# list: anything committed under apps/ is applied with the application
# controller's rights, so a destination here is a namespace the ai-factory
# repository can write every non-blacklisted kind into.
gitops_project_namespaces: >-
  {{ gitops_app_namespaces + [gitops_namespace, 'toolhive-system', 'arc-system',
                              'kube-system', gitops_cert_namespace] }}
gitops_llm_namespace: "ai-llm"
gitops_mcp_namespace: "ai-mcp"
gitops_knowledge_namespace: "ai-knowledge"
gitops_runners_namespace: "ai-runners"
gitops_identity_namespace: "ai-identity"
gitops_assistant_namespace: "ai-assistant"
gitops_keycloak_admin_user: "admin"
gitops_neo4j_user: "neo4j"

# Api key of the llama-server exposed by ricostation. Empty means the model
# server is still unauthenticated and the gateway sends a placeholder it ignores.
gitops_llama_api_key: ""

# Personal access token read by the GitHub MCP server and the context graph
# ingester. Empty means both reach public repositories only.
gitops_github_token: ""

# GitHub App used by the self-hosted Actions runners.
gitops_github_app_id: ""
gitops_github_app_installation_id: ""
# Path, on the ansible controller, to the GitHub App private key (.pem).
gitops_github_app_private_key: ""

# Path, on the ansible controller, to a yaml file holding the OVH api
# credentials the factory's DNS-01 solver uses to write the _acme-challenge
# records Let's Encrypt checks. A path and not three values, for the same reason
# gitops_github_app_private_key is a path: the file is read here, so nothing
# secret passes through a command line or an extra var. It must hold
# applicationKey, applicationSecret and applicationConsumerKey.
#
# Only a wildcard hostname has no alternative to DNS-01 — HTTP-01 cannot answer
# a challenge for one — but the factory puts its whole devpods block on that
# issuer, so leaving this empty costs both *.devpods.<domain> and the dashboard
# at devpods.<domain>. Both keep whatever certificate they already had while
# every application still reports healthy, which is why a file that is present
# but incomplete fails the run rather than being skipped.
gitops_ovh_credentials_file: ""

...
