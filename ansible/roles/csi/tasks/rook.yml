---

- name: Create rook namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        labels:
          kubernetes.io/metadata.name: "{{ csi_rook_namespace }}"
          name: "{{ csi_rook_namespace }}"
          pod-security.kubernetes.io/enforce: privileged
        name: "{{ csi_rook_namespace }}"

- name: Add rook chart repo
  kubernetes.core.helm_repository:
    name: rook
    repo_url: "https://charts.rook.io/release"

- name: Deploy Rook
  kubernetes.core.helm:
    name: rook
    chart_ref: rook/rook-ceph
    chart_version: "{{ csi_rook_chart_version }}"
    release_namespace: "{{ csi_rook_namespace }}"
    values:
      operatorNamespace: "{{ csi_rook_namespace }}"
      # bucketOwner lets a claim hand its bucket to an existing object store
      # user, so one key reaches several buckets (GitLab's consolidated object
      # storage). Off by default: Rook documents that a claim naming an existing
      # bucket re-links it, which is accepted because only the ai-factory
      # AppProject creates claims.
      obcAllowAdditionalConfigFields: "maxObjects,maxSize,bucketOwner"

- name: Ensure CSI CRD is available
  ansible.builtin.pause:
    seconds: 5

- name: Rook CSI Cluster Init
  kubernetes.core.k8s:
    state: present
    template: templates/rook-cluster.yml.j2
  register: csi_cluster

# Terminal pods are excluded, not matched by --all: an Evicted corpse never goes
# Ready and holds the wait for its full timeout. Pending must stay in the set -
# kubectl resolves the match once, so a Running-only filter would pass early.
- name: Wait for cephfs pods become ready
  ansible.builtin.command: >-
    kubectl wait pod --namespace={{ csi_rook_namespace }}
    --selector app={{ item }}
    --field-selector=status.phase!=Failed,status.phase!=Succeeded
    --for=condition=Ready --timeout=900s
  retries: 8
  delay: 120
  register: csi_wait
  until: csi_wait.rc == 0
  loop:
    - rook-ceph-operator
    - kube-rook.cephfs.csi.ceph.com-nodeplugin
    - kube-rook.rbd.csi.ceph.com-nodeplugin
  changed_when: false

- name: Rook Filesystem
  kubernetes.core.k8s:
    state: present
    template: templates/rook-filesystem.yml.j2

- name: Rook Block Storage
  kubernetes.core.k8s:
    state: present
    template: templates/rook-block.yml.j2

# A StorageClass's parameters cannot be changed in place, and older clusters
# carry one naming a store that never existed. No claim can be bound to it, so
# deleting it lets the template below create the corrected one.
- name: Look up the bucket StorageClass
  kubernetes.core.k8s_info:
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: rook-ceph-bucket
  register: csi_bucket_sc

- name: Remove a bucket StorageClass that names the wrong object store
  kubernetes.core.k8s:
    state: absent
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: rook-ceph-bucket
  when: >-
    csi_bucket_sc.resources | length > 0
    and (csi_bucket_sc.resources | first).parameters.objectStoreName != 'my-store'

- name: Rook S3 Storage
  kubernetes.core.k8s:
    state: present
    template: templates/rook-bucket.yml.j2

...
