---

- name: Enable ip forward
  become: true
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: true
    state: present
    reload: true

- name: Add br_netfilter module
  become: true
  community.general.modprobe:
    name: br_netfilter
    state: present

- name: Get cri-o packages list
  ansible.builtin.include_vars: "packages.yml"

- name: Ensure keyring folder is here
  become: true
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'

- name: Get key
  become: true
  ansible.builtin.apt_key:
    url: "{{ crio_repo_url }}/v{{ crio_version }}/deb/Release.key"
    keyring: "{{ crio_keyring_key_path }}"

- name: Add CRI-O repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ crio_keyring_key_path }}] {{ crio_repo_url }}/v{{ crio_version }}/deb/ /"
    state: present

- name: Install crio packages
  become: true
  ansible.builtin.apt:
    name: "{{ crio_packages }}"
    state: present
    update_cache: true
    force: true

- name: Remove crio bridge (conflict with calico)
  become: true
  ansible.builtin.file:
    path: /etc/cni/net.d/100-crio-bridge.conflist
    state: absent

- name: Remove loopback cni (conflict with calico)
  become: true
  ansible.builtin.file:
    path: /etc/cni/net.d/200-loopback.conflist
    state: absent

- name: Ensure containers etc folder exist
  become: true
  when: crio_mirror != ''
  ansible.builtin.file:
    path: /etc/containers/registries.conf.d
    state: directory
    mode: '0755'

- name: Registries config
  become: true
  when: crio_mirror != ''
  ansible.builtin.template:
    src: templates/registries.conf.j2
    dest: /etc/containers/registries.conf.d/001-images-mirror.conf
    mode: '0644'

- name: Enable crio service
  become: true
  ansible.builtin.service:
    name: crio
    enabled: true
    state: started

# Its own tag: a live cluster takes it with --ansible-tags apparmor, without
# replaying the rest of the node setup. Only where the gitops role runs too:
# that role installs the admission policy keeping the profile to ai-build, and
# without it any baseline pod could select it.
- name: Install the AppArmor profile that grants rootless BuildKit user namespaces
  become: true
  ansible.builtin.copy:
    src: apparmor-buildkitd
    dest: /etc/apparmor.d/buildkitd
    owner: root
    group: root
    mode: '0644'
  register: crio_buildkitd_profile
  when: gitops_repo_url | default('') | length > 0
  tags: ["apparmor"]

# apparmor.service loads it at boot; until then it is loaded here, also after a
# run whose load step failed once the file was already in place.
- name: Check whether the kernel has the BuildKit AppArmor profile
  become: true
  ansible.builtin.command: grep -q '^buildkitd ' /sys/kernel/security/apparmor/profiles
  register: crio_buildkitd_loaded
  failed_when: false
  changed_when: false
  check_mode: false
  when: gitops_repo_url | default('') | length > 0
  tags: ["apparmor"]

- name: Load the BuildKit AppArmor profile into the kernel
  become: true
  ansible.builtin.command: apparmor_parser --replace /etc/apparmor.d/buildkitd
  when:
    - gitops_repo_url | default('') | length > 0
    - crio_buildkitd_profile is changed or crio_buildkitd_loaded.rc != 0
  changed_when: true
  tags: ["apparmor"]

...
