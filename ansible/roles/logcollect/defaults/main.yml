---

logcollect_namespace: "logcollect"
logcollect_grafana_namespace: "monitoring"
logcollect_grafana_datasource_label: "grafana_datasource"

logcollect_persistence_disk: false
logcollect_loki_storage_class: "rook-ceph-block"
logcollect_loki_storage_size: "20Gi"
logcollect_loki_retention: "168h"
logcollect_loki_ingestion_rate_mb: 10
logcollect_loki_ingestion_burst_mb: 20
logcollect_loki_max_streams: 5000

logcollect_basic_auth_username: "loki"

logcollect_fluentbit_version: "0.56.0"
logcollect_loki_version: "7.3.0"

# Off by default: loki traces itself and grafana links trace ids in log lines
# to tempo, only where the tracing role runs.
logcollect_tracing_enabled: false
logcollect_otlp_grpc_endpoint: ""

...
